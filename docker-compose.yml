services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - tyagiji_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5000
      MONGODB_URI: mongodb://mongodb:27017/tyagiji_learning
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in root .env}
      COOKIE_SECURE: "false"
      TRUST_PROXY_HOPS: "0"

volumes:
  tyagiji_mongo: {}
